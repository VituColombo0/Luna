# ============================================
# Luna — Configuração de Exemplo
# ============================================
# Copie este arquivo para config.yaml e edite com suas informações.

user:
  name: "Seu Nome"
  nickname: "Seu Apelido"
  bio: "Descreva algo sobre você para a Luna te conhecer melhor."

llm:
  model: "modelo-laob"
  vision_model: "moondream"
  temperature: 0.7
  max_tokens: 200
  ollama_host: "http://localhost:11434"

voice:
  wake_word: "luna"
  stt_model: "base"
  stt_language: "pt"
  stt_device: "cpu"
  tts_engine: "edge-tts"
  tts_voice: "pt-BR-ThalitaMultilingualNeural"
  tts_rate: "+15%"
  silence_threshold: 0.02
  silence_duration: 1.5
  max_record_seconds: 15
  calibration_seconds: 1.5

vision:
  enabled: true
  camera_index: 0
  face_recognition: true
  faces_dir: "data/faces"

memory:
  enabled: true
  db_path: "data/luna_memory"
  collection_name: "conversations"
  max_context_items: 5
  auto_save: true

actions:
  enabled: true
  allow_browser: true
  allow_system_commands: true
  allowed_paths:
    - "~"
    - "~/Documents"
    - "~/Downloads"
    - "~/Desktop"
    - "~/Pictures"
    - "/tmp"
